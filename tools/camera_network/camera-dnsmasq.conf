interface=wlan0
bind-dynamic
listen-address=10.42.0.1
# DHCP only. No DNS proxy, default gateway, NAT, or internet sharing.
port=0
pid-file=/run/serv-camera-dhcp/dnsmasq.pid
dhcp-range=10.42.0.20,10.42.0.80,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
dhcp-authoritative
dhcp-leasefile=/var/lib/serv-bench-network/camera.leases
dhcp-hostsfile=/etc/serv-bench-network/camera-hosts
user=root
group=root
